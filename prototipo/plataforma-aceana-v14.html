 const team={1:1,2:1.05,3:1.1,4:1.15,5:1.2}[n]||1.2;
 const base=comp*((D*n*diaCons)+(diaGer*D))*team*capF;

function toast(m){S.toast=m;clearTimeout(S.toastT);S.toastT=setTimeout(()=>{S.toast='';paintToast()},3200)}
function paintToast(){const t=document.getElementById('tst');if(t)t.innerHTML=S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':''}
const pending=()=>PROPS.filter(p=>p.ap.st==='req').length;
const failures=()=>RUNS.filter(r=>r.st==='falha').length;
const num=x=>{let s=String(x).replace(/R\$|\s/g,'');if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)){s=s.replace(/\./g,'')}const n=parseFloat(s);return isNaN(n)?0:n};

const bar=(n,max)=>`<div class="bar"><div style="width:${max?Math.round(n/max*100):0}%"></div></div>`;

const FUNIL=['Reunião marcada','Diagnóstico realizado','Proposta apresentada','Fechamento','Ganho'];
const FUNIL0=[
 {st:'Reunião marcada',client:'Clínica Vet Bem Estar',contact:'Dra. Paula',sol:'SOL-017',val:10500,owner:'Lara',nota:'Reunião em 04/11'},
 {st:'Reunião marcada',client:'Móveis Casa Bela',contact:'Nilton Rocha',sol:'SOL-021',val:7000,owner:'Larissa Silva',nota:'Reunião em 05/11'}];
function funilCards(){
 const out=[];
 FUNIL0.forEach(d=>out.push({st:d.st,client:d.client,sub:d.contact+' · '+d.nota,sol:d.sol,val:d.val,owner:d.owner,a:'dealInfo',attr:''}));
 DEALS.filter(d=>!PROPS.some(p=>p.deal===d.id)).forEach(d=>out.push({st:'Diagnóstico realizado',client:d.client,sub:d.contact+' · sem proposta',sol:d.sol,val:d.val,owner:'',a:'importDeal',attr:'data-d="'+d.id+'"',cta:'Criar proposta'}));
 PROPS.forEach(p=>{const st=dealStage(p);if(st==='—')return;out.push({st,client:p.client,sub:p.code+' · '+p.status,sol:p.sol,val:p.price||p.crm||0,owner:p.owner,a:'open',attr:'data-c="'+p.code+'"'})});
 return out;
}
function vPainel(){
 const all=funilCards();
 const card=x=>`<button class="kcard" data-a="${x.a}" ${x.attr}><b>${esc(x.client)}</b><span class="small muted">${esc(x.sub)}</span><span class="small">${esc(solName(x.sol))}</span><span class="row" style="justify-content:space-between;gap:6px"><b>${x.val?BRL(x.val):'Sem valor'}</b><span class="small muted">${esc((x.owner||'').split(' ')[0])}</span></span>${x.cta?`<span class="chip y" style="align-self:flex-start">${x.cta}</span>`:''}</button>`;

}

function vCliente(){
 const p=PR(S.cliente)||PROPS.find(x=>x.accepted&&!x.form)||PROPS[0];S.cliente=p.code;
 const f=S.form[p.code]||(S.form[p.code]=Object.assign({},p.form||{}));
 const n=FKEYS.filter(k=>String(f[k]||'').trim()).length;

function wsHead(p){
 const st=steps(p);
 return `<p style="margin-bottom:10px"><a class="small" href="#propostas"><b>← Voltar</b></a></p>
 <div class="head" style="margin-bottom:6px"><div><h1>${esc(p.client)}</h1><div class="row"><span class="chip ${stCls(p.status)}">${p.status}</span><span class="chip">${p.price?BRL(p.price):'Sem preço'}</span><span class="chip">Deal Pipedrive #${p.deal}</span><span class="chip">Proposta v${p.ver}</span><span class="small muted">${p.code} · ${esc(solName(p.sol))}</span></div></div></div>
 <div class="steps" aria-label="Etapas da proposta">${st.map(s=>`<div class="step ${s.c}"><i>${s.c==='done'?'Feito':(s.c==='now'?'Agora':'Depois')}</i>${s.n}</div>`).join('')}</div>
 <div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab ${p.tab===t[0]?'on':''}" role="tab" data-a="tab" data-c="${p.code}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
}

function pdSide(p){
 const rs=RUNS.filter(r=>r.code===p.code&&r.sys==='pipedrive');
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Pipedrive</h2><span class="chip ok">Conectado (simulado)</span></div>
 <dl class="kv" style="margin:12px 0"><dt>Organização</dt><dd>${esc(p.client)}</dd><dt>Contato</dt><dd>${esc(p.contact)}</dd><dt>Valor no deal</dt><dd>${BRL(p.price||p.crm||0)}</dd><dt>Etapa do deal</dt><dd>${dealStage(p)}</dd></dl>
 <p class="small muted">A plataforma lê o deal e grava de volta etapa, valor, link, validade, margem, semáforo, aprovação e assinatura. ${rs.length} gravações nesta proposta.</p></div>`;
}
function dealStage(p){return {'Rascunho':'Diagnóstico realizado','Em aprovação':'Diagnóstico realizado','Aprovada':'Diagnóstico realizado','Recusada':'Diagnóstico realizado','Proposta enviada':'Proposta apresentada','Positiva':'Fechamento','Em assinatura':'Fechamento','Assinado':'Fechamento','Projeto criado':'Ganho'}[p.status]||'—'}

function vResumo(p){
 const st=steps(p),cur=st.find(s=>s.c==='now'),nx=cur?NEXT[cur.n]:null,c=calc(p);

  ${items.map((it,i)=>`<div class="mod"><div class="b"><div class="row"><span class="chip ${it[0]==='Dor'?'bad':(it[0]==='Objetivo'?'ok':'warn')}">${it[0]}</span></div><h3>${esc(it[1])}</h3><p class="quote">${esc(it[2])}</p><p class="small muted">${esc(it[3])}</p></div><button class="btn ${p.dxOn[i]?'q':'p'}" data-a="dxToggle" data-c="${p.code}" data-i="${i}" ${ed?'':'disabled'}>${p.dxOn[i]?'Confirmado':'Confirmar'}</button></div>`).join('')}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Próximo passo</h2><p class="small muted">A plataforma monta o escopo em rascunho com módulos do catálogo. Você revisa.</p></div><button class="btn y" data-a="tab" data-c="${p.code}" data-t="esc">Ver escopo</button></div></div>`;

function vPreco(p){

 const c=calc(p),ed=can('Criar e editar'),mg=can('Ver margem'),st=p.ap.st;
 const reasons=[c.below?'Preço abaixo do piso de '+BRL(c.piso)+'.':'',c.low?'Contribuição prevista de '+PCT(c.cp)+', abaixo de '+Math.round(P.min*100)+'%.':'',c.cust?'Atividade fora do catálogo com risco: '+custPend(p).map(x=>x.n).join(', ')+'.':''].filter(Boolean);
 let box='';
 if(!c.V) box='<div class="banner info" style="margin-top:12px">Defina o preço ao lado para ver quem aprova.</div>';
 else if(st==='ok') box=`<div class="banner ok" style="margin:12px 0">Aprovado por ${esc(p.ap.by)}${p.ap.exc?' (exceção)':''}, ${esc(p.ap.at)}. Catálogo ${p.ap.cv} · parâmetros v${p.ap.pv}.</div>`;

 else if(st==='req'){

 }else if(c.exc){
  box=`<div class="banner warn" style="margin:12px 0"><b>Exceção.</b> ${reasons.join(' ')} Precisa da aprovação do Diretor ou Head de Projetos antes do envio.</div>`+(ed?`<div class="f"><label for="just-${p.code}">Justificativa (obrigatória)</label><textarea id="just-${p.code}" rows="2" placeholder="Por que fechar neste preço?"></textarea></div><button class="btn p" style="margin-top:12px" data-a="reqExc" data-c="${p.code}">Pedir aprovação à Diretoria de Projetos</button>`:'<p class="small muted">Seu perfil só visualiza.</p>');
 }else{
  box=`<div class="banner ok" style="margin:12px 0">Dentro da regra. Aprovação do gerente de negócios, com um clique.</div>`+(can('Aprovar preço e contrato')?`<button class="btn p" data-a="approveGn" data-c="${p.code}">Aprovar preço</button><p class="small muted" style="margin-top:8px">Fica registrado com seu nome, data e as versões do catálogo e dos parâmetros.</p>`:'<p class="small muted">Alçada: gerente de negócios. Troque o usuário no menu para testar.</p>');
 }
 const inp=(f,l,v,dis)=>`<div class="f"><label for="pr-${f}">${l}</label><input id="pr-${f}" value="${esc(v)}" data-chg="priceSet" data-c="${p.code}" data-f="${f}" ${(ed&&!dis)?'':'disabled'}></div>`;

 <div class="row" style="margin-bottom:14px"><span class="small muted">Cenários do protótipo:</span><button class="btn q" data-a="preset" data-c="${p.code}" data-v="std" ${ed?'':'disabled'}>Padrão</button><button class="btn q" data-a="preset" data-c="${p.code}" data-v="low" ${ed?'':'disabled'}>Abaixo do piso</button><button class="btn q" data-a="preset" data-c="${p.code}" data-v="cost" ${ed?'':'disabled'}>Custos externos altos</button></div>
 <div class="grid2">${inp('price','Valor apresentado na proposta (âncora, R$)',p.price?String(p.price).replace('.',','):'')}${inp('custos','Custos totais previstos (R$)',String(p.custos||0).replace('.',','))}
 <div class="f"><label for="pr-parc">Parcelas${sp?' (máx. '+sp.parcMax+')':''}</label><select id="pr-parc" data-chg="priceSet" data-c="${p.code}" data-f="parcelas" ${ed?'':'disabled'}>${[1,2,3,4,6].filter(n=>!sp||n<=sp.parcMax).map(n=>`<option ${p.parcelas===n?'selected':''} value="${n}">${n}×</option>`).join('')}</select></div>
 <div class="f"><label>Dias úteis · membros</label><input value="${c.D} dias · ${c.M} membros" disabled></div></div>
 ${sp?`<div class="banner info" style="margin-top:12px"><b>A planilha de precificação calculou</b> (capacidade de ${sp.ref}, parâmetros v${P.v}): mínimo ${BRL(sp.min)} · esperado ${BRL(sp.esp)} · máximo ${BRL(sp.max)}.<br>Você ancora o valor da proposta, que pode ficar acima ou abaixo do calculado. A margem abaixo usa o valor apresentado.${ed?`<div style="margin-top:8px"><button class="btn q" data-a="useCalc" data-c="${p.code}">Usar o esperado (${BRL(Math.round(sp.esp))})</button></div>`:''}</div>`:''}

 ${c.ext?`<div class="banner warn" style="margin-top:14px">Custos externos acima de ${Math.round(P.ext*100)}% do valor vendido (${PCT(c.C/c.V)}). Revise antes de seguir.</div>`:''}

 <div class="s"><div class="card"><h2>Aprovação do preço</h2>${box}</div>

 const items=(DX[p.sol]||[]),conf=items.filter((x,i)=>p.dxOn[i]);
 const v=validade(p),inv=p.price||0;
 const byE=ETAPAS.map(e=>[e,sel(p).filter(m=>m.e===e)]).filter(x=>x[1].length);
 const web=`<div class="doc"><h2>Proposta v${p.ver} · ${p.code}</h2><p><b>A.C.E. Consultoria Júnior da UFPE para ${esc(p.client)}</b></p>
 <h2>O que entendemos</h2>${conf.length?conf.filter(x=>x[0]!=='Restrição'||!/orçamento/.test(x[1])).map(x=>`<p><b>${x[0]}:</b> ${esc(x[1])}.</p>`).join(''):'<p class="muted">[o diagnóstico confirmado aparece aqui]</p>'}
 <h2>O que vamos fazer</h2>${byE.map(([e,ms])=>`<p><b>${e}:</b> ${ms.map(m=>esc(m.n)+' ('+m.d+' dias úteis)').join('; ')}.</p>`).join('')||'<p class="muted">[escopo]</p>'}

 ${done?`<div class="card"><div class="banner ok" style="margin-bottom:14px"><b>Ganho registrado.</b> As três assinaturas chegaram. A plataforma executou as ações abaixo e guardou o registro.</div><div class="sx"><table class="tbl"><thead><tr><th>Conexão</th><th>Operação</th><th>Resultado</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${r.sys}</b></td><td>${r.op}</td><td><span class="chip ${r.st==='falha'?'bad':'ok'}">${r.st}</span>${r.err?`<div class="small muted">${esc(r.err)}</div>`:''}</td><td>${r.st==='falha'?`<button class="btn q" data-a="retry" data-r="${r.id}">Reprocessar</button>`:''}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">Uma falha de conexão não perde dado: fica na fila e avisa o gerente. Reprocessar não duplica o projeto no Monday.</p></div>

window.__fx={running:false};
let fxRaf=0,fxRO=null,fxCanvas=null;
function fxStop(){if(fxRaf)cancelAnimationFrame(fxRaf);fxRaf=0;if(fxRO)fxRO.disconnect();fxRO=null;fxCanvas=null;window.__fx.running=false}
function fxDraw(cv,t){
 const ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,1.5);
 const w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 const css=getComputedStyle(document.documentElement),c1=css.getPropertyValue('--yellow').trim(),c2=css.getPropertyValue('--orange').trim();
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,w,h);
 ctx.globalCompositeOperation='lighter';
 const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,c2);g.addColorStop(.5,c1);g.addColorStop(1,c2);
 ctx.strokeStyle=g;ctx.lineWidth=1.2;
 const lines=48,step=Math.max(6,w/140);
 for(let i=0;i<lines;i++){
  const k=i/lines;
  ctx.globalAlpha=.06+.22*Math.sin(Math.PI*k);
  ctx.beginPath();
  for(let x=0;x<=w+step;x+=step){
   const y=h*.56+Math.sin(x*.0042+t*.00045+k*1.6)*h*.13+Math.sin(x*.0011-t*.0003+k*.8)*h*.09+(k-.5)*h*.42*(.6+.4*Math.sin(x*.0024+t*.00025));
   x?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
 }
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function syncFx(){
 const cv=document.getElementById('hero-fx');
 if(!cv||(location.hash||'#inicio')!=='#inicio'){fxStop();return}
 if(cv===fxCanvas)return;
 fxStop();fxCanvas=cv;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){fxDraw(cv,4000);return}
